name: Build and Deploy Documentation

on:
  push:
    branches: ["main"] # Triggers when you push to main
  workflow_dispatch:   # Allows you to trigger it manually from the UI

# Give the action permission to push to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ensure only one deployment runs at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install Python Dependencies
        # Matches the exact versions from your Dockerfile
        run: |
          pip install sphinx==8.1.3 breathe==4.36.0 furo==2025.12.19 myst-parser==4.0.1 exhale==0.3.7

      - name: Build HTML Docs
        # Fails the build if there are warnings (-W) to keep docs pristine
        run: sphinx-build -W -b html docs docs/_build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_build/html'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4