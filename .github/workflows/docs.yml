name: Build Documentation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Install Python Dependencies
        # Matches the exact versions from your Dockerfile
        run: |
          pip install sphinx==8.1.3 breathe==4.36.0 furo==2025.12.19 myst-parser==4.0.1 exhale==0.3.7

      - name: Run Doxygen
        run: |
          mkdir -p docs/_build/doxygen
          doxygen docs/Doxyfile

      - name: Build HTML Docs
        # Fails the build if there are warnings (-W) to keep docs pristine
        run: sphinx-build -W -b html docs docs/_build/html

