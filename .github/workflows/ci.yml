name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Formatting ────────────────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format-18
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18

      - name: Install gersemi
        run: pip install gersemi

      - name: Check C++ formatting
        run: |
          find libs proto tests -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            | xargs -r clang-format-18 --dry-run --Werror

      - name: Check CMake formatting
        run: gersemi --check .

  # ── Commit message linting ────────────────────────────────────────────────
  commitlint:
    name: Commit messages
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ./commitlint.config.mjs
          failOnWarnings: false
          failOnErrors: true

  # ── Debug build + static analysis ────────────────────────────────────────
  build:
    name: Build and lint (debug)
    runs-on: ubuntu-22.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 clang-tidy-18 cmake ninja-build

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conan.lock') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Export custom recipes
        run: |
          conan export conan/recipes/zenoh-c
          conan export conan/recipes/zenoh-cpp

      - name: Install dependencies
        run: |
          conan install . \
            --build=missing \
            --profile=conan/profiles/x86_64/debug \
            --lockfile=conan.lock \
            -c tools.system.package_manager:mode=check

      - name: Configure
        run: cmake --preset debug --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

      - name: Lint
        run: |
          run-clang-tidy-18 -p build/Debug \
            "^${GITHUB_WORKSPACE}/(libs|proto|tests)/"

  # ── Release build + test ──────────────────────────────────────────────────
  build-release:
    name: Build and test (release)
    runs-on: ubuntu-22.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 cmake ninja-build

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conan.lock') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Export custom recipes
        run: |
          conan export conan/recipes/zenoh-c
          conan export conan/recipes/zenoh-cpp

      - name: Install dependencies
        run: |
          conan install . \
            --build=missing \
            --profile=conan/profiles/x86_64/release \
            --lockfile=conan.lock \
            -c tools.system.package_manager:mode=check

      - name: Configure
        run: cmake --preset release --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  # ── AddressSanitizer + UndefinedBehaviorSanitizer ─────────────────────────
  sanitize:
    name: Sanitize (ASan + UBSan)
    runs-on: ubuntu-22.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 cmake ninja-build libclang-rt-18-dev

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conan.lock') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Export custom recipes
        run: |
          conan export conan/recipes/zenoh-c
          conan export conan/recipes/zenoh-cpp

      - name: Install dependencies
        run: |
          conan install . \
            --build=missing \
            --profile=conan/profiles/x86_64/debug \
            --lockfile=conan.lock \
            -c tools.system.package_manager:mode=check

      - name: Configure
        run: cmake --preset sanitize --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset sanitize

      - name: Test
        run: ctest --preset sanitize

  # ── ThreadSanitizer ───────────────────────────────────────────────────────
  tsan:
    name: Thread Sanitizer
    runs-on: ubuntu-22.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 cmake ninja-build libclang-rt-18-dev

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conan.lock') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Export custom recipes
        run: |
          conan export conan/recipes/zenoh-c
          conan export conan/recipes/zenoh-cpp

      - name: Install dependencies
        run: |
          conan install . \
            --build=missing \
            --profile=conan/profiles/x86_64/debug \
            --lockfile=conan.lock \
            -c tools.system.package_manager:mode=check

      - name: Configure
        run: cmake --preset tsan --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset tsan

      - name: Test
        run: ctest --preset tsan

  # ── Coverage ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 cmake ninja-build libclang-rt-18-dev llvm-18

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conan.lock') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Export custom recipes
        run: |
          conan export conan/recipes/zenoh-c
          conan export conan/recipes/zenoh-cpp

      - name: Install dependencies
        run: |
          conan install . \
            --build=missing \
            --profile=conan/profiles/x86_64/debug \
            --lockfile=conan.lock \
            -c tools.system.package_manager:mode=check

      - name: Configure
        run: cmake --preset coverage --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Merge profiles
        run: |
          llvm-profdata-18 merge -sparse build/Coverage/cov-*.profraw \
            -o build/Coverage/coverage.profdata

      - name: Report
        run: |
          llvm-cov-18 report build/Coverage/tests/orion_tests \
            -instr-profile=build/Coverage/coverage.profdata \
            --ignore-filename-regex="(build/|/_deps/)" \
            | tee /tmp/coverage-summary.txt
          {
            echo "## Coverage Report"
            echo '```'
            cat /tmp/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce minimum coverage
        run: |
          # Extract the third percentage value on the TOTAL line (= line coverage).
          # Branch coverage may be "-" so $NF is unreliable.
          COVERAGE=$(awk '/^TOTAL/ {
            n=0; for(i=1;i<=NF;i++) if($i~/[0-9]%$/) { n++; if(n==3) { gsub(/%/,"",$i); print $i; break } }
          }' /tmp/coverage-summary.txt)
          echo "Line coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !(${COVERAGE}+0 < 60) }"; then
            echo "Coverage ${COVERAGE}% is below the 60% minimum — add tests."
            exit 1
          fi

  # ── Cross-compile for ARM64 ───────────────────────────────────────────────
  cross-arm64:
    name: Cross-compile (ARM64)
    runs-on: ubuntu-22.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 cmake ninja-build gcc-aarch64-linux-gnu

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages (arm64)
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-arm64-${{ runner.os }}-${{ hashFiles('conan.lock') }}
          restore-keys: conan-arm64-${{ runner.os }}-

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Export custom recipes
        run: |
          conan export conan/recipes/zenoh-c
          conan export conan/recipes/zenoh-cpp

      - name: Install dependencies (cross)
        run: |
          conan install . \
            --build=missing \
            --profile:build=conan/profiles/x86_64/debug \
            --profile:host=conan/profiles/arm64/debug \
            --output-folder=build/CrossArm64 \
            --lockfile=conan.lock \
            -c tools.system.package_manager:mode=check

      - name: Configure
        run: cmake --preset cross-arm64 --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset cross-arm64

  # ── libFuzzer smoke test ──────────────────────────────────────────────────
  fuzz:
    name: Fuzz (smoke test)
    runs-on: ubuntu-22.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 cmake ninja-build libclang-rt-18-dev

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conan.lock') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Configure Conan profile
        run: conan profile detect --force

      - name: Export custom recipes
        run: |
          conan export conan/recipes/zenoh-c
          conan export conan/recipes/zenoh-cpp

      - name: Install dependencies
        run: |
          conan install . \
            --build=missing \
            --profile=conan/profiles/x86_64/debug \
            --lockfile=conan.lock \
            -c tools.system.package_manager:mode=check

      - name: Configure
        run: cmake --preset fuzz --no-warn-unused-cli

      - name: Build fuzz targets
        run: cmake --build --preset fuzz

      - name: Smoke-test fuzz targets
        run: |
          ./build/Fuzz/tests/fuzz/fuzz_topic \
            -runs=10000 \
            -max_len=4096 \
            -timeout=10 \
            2>&1
