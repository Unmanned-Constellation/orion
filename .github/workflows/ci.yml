name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Formatting ────────────────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format-18
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get -o Acquire::http::Timeout=60 update -qq
          sudo apt-get install -y clang-format-18

      - name: Install gersemi
        run: pip install gersemi

      - name: Check C++ formatting
        run: |
          find libs proto tests -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            | xargs -r clang-format-18 --dry-run --Werror

      - name: Check CMake formatting
        run: gersemi --check .

  # ── Proto schema linting ─────────────────────────────────────────────────
  proto:
    name: Proto schema
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install buf
        run: |
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v1.69.0/buf-Linux-$(uname -m)" \
            -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Lint
        run: buf lint

      - name: Check for breaking changes
        run: |
          if git ls-remote --exit-code origin main 2>/dev/null; then
            if git ls-tree -r origin/main --name-only | grep -q '\.proto$'; then
              buf breaking --against '.git#branch=origin/main'
            else
              echo "No .proto files on main — skipping breaking-change check"
            fi
          else
            echo "No main branch on remote — skipping breaking-change check"
          fi

# ── API documentation coverage ───────────────────────────────────────────
  docs:
    name: Docs coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Doxygen
        run: sudo apt-get -o Acquire::http::Timeout=60 update -qq && sudo apt-get install -y --no-install-recommends doxygen

      - name: Install Sphinx dependencies
        run: pip install -r docs/requirements.txt

      - name: Run Doxygen
        run: |
          mkdir -p docs/_build/doxygen
          doxygen docs/Doxyfile

      - name: Build Sphinx docs
        run: LC_ALL=C.UTF-8 LANG=C.UTF-8 sphinx-build -W -b html docs docs/_build/html

  # ── Debug build + static analysis ────────────────────────────────────────
  build:
    name: Build and lint (debug)
    needs: [format, docs, proto]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
        with:
          conan-profile: conan/profiles/x86_64/debug
          extra-packages: clang-tidy-18

      - name: Configure
        run: cmake --preset debug --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

      - name: Lint
        run: |
          run-clang-tidy-18 -p build/Debug \
            "^${GITHUB_WORKSPACE}/(libs|proto|tests)/"

  # ── Release build + test ──────────────────────────────────────────────────
  build-release:
    name: Build and test (release)
    needs: [format, docs, proto]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
        with:
          conan-profile: conan/profiles/x86_64/release

      - name: Configure
        run: cmake --preset release --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  # ── AddressSanitizer + UndefinedBehaviorSanitizer ─────────────────────────
  sanitize:
    name: Sanitize (ASan + UBSan)
    needs: [format, docs, proto]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
        with:
          conan-profile: conan/profiles/x86_64/debug
          extra-packages: libclang-rt-18-dev

      - name: Configure
        run: cmake --preset sanitize --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset sanitize

      - name: Test
        run: ctest --preset sanitize

  # ── ThreadSanitizer ───────────────────────────────────────────────────────
  tsan:
    name: Thread Sanitizer
    needs: [format, docs, proto]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
        with:
          conan-profile: conan/profiles/x86_64/debug
          extra-packages: libclang-rt-18-dev

      - name: Configure
        run: cmake --preset tsan --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset tsan

      - name: Test
        run: ctest --preset tsan

  # ── Coverage ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    needs: [format, docs, proto]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
        with:
          conan-profile: conan/profiles/x86_64/debug
          extra-packages: libclang-rt-18-dev llvm-18

      - name: Configure
        run: cmake --preset coverage --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Merge profiles
        run: |
          llvm-profdata-18 merge -sparse build/Coverage/cov-*.profraw \
            -o build/Coverage/coverage.profdata

      - name: Report
        run: |
          llvm-cov-18 report build/Coverage/tests/orion_tests \
            -instr-profile=build/Coverage/coverage.profdata \
            --ignore-filename-regex="(build/|/_deps/)" \
            | tee /tmp/coverage-summary.txt
          {
            echo "## Coverage Report"
            echo '```'
            cat /tmp/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce minimum coverage
        run: |
          COVERAGE=$(awk '/^TOTAL/ {
            n=0; for(i=1;i<=NF;i++) if($i~/[0-9]%$/) { n++; if(n==3) { gsub(/%/,"",$i); print $i; break } }
          }' /tmp/coverage-summary.txt)
          echo "Line coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !(${COVERAGE}+0 < 60) }"; then
            echo "Coverage ${COVERAGE}% is below the 60% minimum — add tests."
            exit 1
          fi

  # ── Native ARM64 build + test ─────────────────────────────────────────────
  build-arm64:
    name: Build and test (ARM64)
    needs: [format, docs, proto]
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
        with:
          conan-profile: conan/profiles/arm64/debug
          cache-key-prefix: conan-arm64

      - name: Configure
        run: cmake --preset debug --no-warn-unused-cli

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  # ── libFuzzer smoke test ──────────────────────────────────────────────────
  fuzz:
    name: Fuzz (smoke test)
    needs: [format, docs, proto]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-builder
        with:
          conan-profile: conan/profiles/x86_64/debug
          extra-packages: libclang-rt-18-dev

      - name: Configure
        run: cmake --preset fuzz --no-warn-unused-cli

      - name: Build fuzz targets
        run: cmake --build --preset fuzz

      - name: Smoke-test fuzz targets
        run: |
          ./build/Fuzz/tests/fuzz/fuzz_topic \
            -runs=10000 \
            -max_len=4096 \
            -timeout=10 \
            2>&1
          ./build/Fuzz/tests/fuzz/fuzz_envelope \
            -runs=10000 \
            -max_len=65536 \
            -timeout=10 \
            2>&1
