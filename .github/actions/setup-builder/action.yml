name: Setup C++ builder
description: Installs LLVM 18, Conan, exports local recipes, and installs dependencies.

inputs:
  conan-profile:
    description: Conan host profile path
    required: true
  extra-packages:
    description: Space-separated extra apt packages (e.g. clang-tidy-18 llvm-18)
    required: false
    default: ""
  cache-key-prefix:
    description: Prefix for the Conan package cache key
    required: false
    default: conan

runs:
  using: composite
  steps:
    - name: Install toolchain
      shell: bash
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update -qq
        sudo apt-get install -y clang-18 cmake ninja-build ${{ inputs.extra-packages }}

    - name: Install Conan
      shell: bash
      run: pip install conan

    - name: Cache Conan packages
      uses: actions/cache@v5
      with:
        path: ~/.conan2/p
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ hashFiles('conan.lock') }}
        restore-keys: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-

    - name: Configure Conan profile
      shell: bash
      run: conan profile detect --force

    - name: Export custom recipes
      shell: bash
      run: |
        conan export conan/recipes/zenoh-c
        conan export conan/recipes/zenoh-cpp

    - name: Install dependencies
      shell: bash
      run: |
        conan install . \
          --build=missing \
          --profile=${{ inputs.conan-profile }} \
          --lockfile=conan.lock \
          -c tools.system.package_manager:mode=check
