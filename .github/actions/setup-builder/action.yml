name: Setup C++ builder
description: Configures ccache, registers the local Conan remote, and installs dependencies against the pre-baked image cache.

inputs:
  conan-profile:
    description: Conan host profile path
    required: true
  cache-key-prefix:
    description: Prefix for ccache keys
    required: false
    default: conan

outputs:
  ccache-key:
    description: Exact cache key to use when saving ccache after the build step
    value: ${{ steps.ccache-key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Configure ccache
      shell: bash
      run: |
        ccache --set-config=cache_dir="$HOME/.cache/ccache"
        ccache --set-config=base_dir="$GITHUB_WORKSPACE"
        ccache --set-config=max_size=1G
        ccache --set-config=compression=true
        echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
        echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

    - name: Compute ccache key
      id: ccache-key
      shell: bash
      run: echo "key=ccache-${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Restore ccache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/ccache
        key: ccache-${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: ccache-${{ inputs.cache-key-prefix }}-${{ runner.os }}-

    - name: Configure Conan profile
      shell: bash
      run: conan profile detect --force

    - name: Register local recipes remote
      shell: bash
      run: |
        conan remote add orion-local "$GITHUB_WORKSPACE/conan" \
          -t local-recipes-index --index 0 -f

    - name: Install dependencies
      shell: bash
      run: |
        conan install . \
          --build=missing \
          --profile=${{ inputs.conan-profile }} \
          --lockfile=conan.lock \
          -c tools.system.package_manager:mode=check
